<!-- Modal de Carga centrado en pantalla -->
<div class="modal fade" tabindex="-1" role="dialog" id="loadingModal" aria-hidden="true"
  [ngClass]="{'show d-block': isLoading}" [style.display]="isLoading ? 'block' : 'none'">
  <div class="modal-dialog modal-dialog-centered justify-content-center" role="document">
    <div class="modal-content" style="background-color: transparent; border: none;">
      <div class="modal-body text-center">
        <!-- Spinner de carga de Bootstrap personalizado con más grosor y color magenta -->
        <div class="spinner-border custom-spinner" role="status">
          <span class="sr-only">Cargando...</span>
        </div>
      </div>
    </div>
  </div>
</div>
