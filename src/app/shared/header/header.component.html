<div class="modal fade" id="viewModalPassword" tabindex="-1" role="dialog" aria-labelledby="exampleModalCenterTitle"
  aria-hidden="true" data-backdrop="static" data-keyboard="false">
  <div class="modal-dialog modal-lg" role="document">
    <div class="modal-content">
      <form [formGroup]="formPassword" (ngSubmit)="onSubmitPassword()" class="form-horizontal">
        <div class="modal-header">
          <h3 class="modal-title" style="margin-bottom: 0;color:rgb(1, 112, 185)" id="exampleModalLongTitle">Cambio de contraseña</h3>
          <button type="button" #closebutton class="close" data-dismiss="modal" aria-label="Close">
            <span aria-hidden="true">&times;</span>
          </button>
        </div>
        <div class="modal-body">
          <div class="container-fluid" style="text-align: center;">
            <div class="row">
              <div class="col-md-12">
                <div class="form-group row">
                  <label for="id" class="col-form-label col-sm-3">Contraseña actual</label>
                  <div class="col-sm-8" style="position: relative; display: flex;">
                    <input [type]="showPassword1 ? 'text' : 'password'" class="form-control"
                      formControlName="passActual" placeholder="Contraseña"
                      [ngClass]="{'is-invalid': submitted && formPassword.hasError('required', 'passActual') }">
                    <div class="input-group-append">
                      <div class="input-group-text">
                        <span *ngIf="!showPassword1" class="fa fa-eye" (click)="togglePasswordVisibility1()"></span>
                        <span *ngIf="showPassword1" class="fa fa-eye-slash"
                          (click)="togglePasswordVisibility1()"></span>
                      </div>
                    </div>
                    <div *ngIf="submitted && formPassword.hasError('errors', 'passActual')" class="invalid-feedback">
                      <div *ngIf="formPassword.hasError('required', 'passActual')">Este campo es obligatorio</div>
                    </div>
                  </div>
                </div>
              </div>
              <div class="col-md-12">
                <div class="form-group row">
                  <label for="id" class="col-form-label col-sm-3">Nueva contraseña </label>
                  <div class="col-sm-8" style="position: relative; display: flex;">
                    <input [type]="showPassword2 ? 'text' : 'password'" class="form-control" formControlName="passNueva"
                      placeholder="Contraseña"
                      [ngClass]="{'is-invalid': submitted && formPassword.hasError('required', 'passNueva') }">
                    <div class="input-group-append">
                      <div class="input-group-text">
                        <span *ngIf="!showPassword2" class="fa fa-eye" (click)="togglePasswordVisibility2()"></span>
                        <span *ngIf="showPassword2" class="fa fa-eye-slash"
                          (click)="togglePasswordVisibility2()"></span>
                      </div>
                    </div>
                    <div *ngIf="submitted && formPassword.hasError('errors', 'passNueva')" class="invalid-feedback">
                      <div *ngIf="formPassword.hasError('required', 'passNueva')">Este campo es obligatorio</div>
                    </div>
                  </div>
                </div>
              </div>

              <div class="col-md-12">

                <div class="form-group row">
                  <label for="id" class="col-form-label col-sm-3">Confirmar contraseña</label>
                  <div class="col-sm-8" style="position: relative; display: flex;">
                    <input [type]="showPassword3 ? 'text' : 'password'" class="form-control"
                      formControlName="passNueva2" placeholder="Contraseña"
                      [ngClass]="{'is-invalid': submitted && formPassword.hasError('required', 'passNueva2') }">
                    <div class="input-group-append">
                      <div class="input-group-text">
                        <span *ngIf="!showPassword3" class="fa fa-eye" (click)="togglePasswordVisibility3()"></span>
                        <span *ngIf="showPassword3" class="fa fa-eye-slash"
                          (click)="togglePasswordVisibility3()"></span>
                      </div>
                    </div>
                    <div *ngIf="submitted && formPassword.hasError('errors', 'passNueva2')" class="invalid-feedback">
                      <div *ngIf="formPassword.hasError('required', 'passNueva2')">Este campo es obligatorio</div>

                    </div>
                    <!--<div *ngIf="showerror" class="nomatchpass">Este campo es obligatorio</div>-->

                  </div>

                </div>
              </div>

            </div>

              <div class="row" >
                <div class="col-md-6  text-center" >
                  <button type="submit" mat-raised-button class="btn btn-outline-success btn-sm" #closeBtn>Actualizar</button>
                </div>
                <div class="col-md-6  text-center">
                  <button type="button" mat-raised-button class="btn btn-outline-danger btn-sm" data-dismiss="modal">Cerrar</button> 
                </div>
              </div>

          </div>
        </div>

        <div class="modal-footer">
        </div>
      </form>
    </div>
  </div>
</div>
